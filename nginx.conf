# nginx-Konfiguration für den statischen Astro-Build (dist/).
# Clean URLs ohne Trailing Slash: /sanierung/heidelberg → /sanierung/heidelberg/index.html
# (ranking-kritisch: keine 301-Umleitungen auf Slash-Varianten).
#
# Diese Datei wird als /etc/nginx/templates/default.conf.template ins Image kopiert. Das
# nginx-Image ersetzt beim Start ${ROBOTS_TAG} per envsubst durch die Umgebungsvariable.
#   - PROD (main):  ROBOTS_TAG ist NICHT gesetzt → Default "all" aus dem Dockerfile → indexierbar.
#   - STAGING (dev): in Dokploy ROBOTS_TAG = "noindex, nofollow" setzen → nicht indexierbar.
# So bleibt dieselbe Datei auf beiden Branches identisch (konfliktfreies dev→main-Mergen);
# der Unterschied liegt nur in der Env-Variable. Fällt sie weg, ist Prod sicher indexierbar.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Indexierbarkeit über Env-Variable (siehe Kopf). Default "all" = index,follow.
    add_header X-Robots-Tag "${ROBOTS_TAG}" always;

    # Kompression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml text/plain font/ttf font/woff font/woff2;
    gzip_min_length 1024;

    # Clean URLs: erst Datei, dann Ordner-index.html — ohne Redirect
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Statische Assets: lange Cache-Zeiten (Dateinamen sind gehasht/stabil)
    # (X-Robots-Tag hier wiederholen: nginx erbt add_header nicht in Locations mit eigenem add_header)
    location ~* \.(css|js|woff2?|ttf|eot|png|jpe?g|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;
        try_files $uri =404;
    }

    # HTML nicht aggressiv cachen (Inhalte sollen nach Deploy frisch sein)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;
    }

    # Sitemap & robots direkt
    location = /robots.txt { }
    location = /sitemap-index.xml { }
}
